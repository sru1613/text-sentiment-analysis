{% extends 'base.html' %}
{% block title %}Analyze - Sentiment App{% endblock %}
{% block breadcrumbs %}
  🧪 Analyze
{% endblock %}
{% block content %}
  <h1>Sentiment Analyzer</h1>
  <div class="section theme-rose" aria-expanded="true" data-key="sec-analyze">
    <button class="section-header" type="button"><span class="icon" aria-hidden></span><h2 style="color: #ffffff;">Analyze Text / File</h2><span class="chevron" aria-hidden>▾</span></button>
    <div class="section-content">
      <section class="input">
        <label for="text" style="color: aliceblue;">Enter text to analyze</label>
        <textarea id="text" rows="6" placeholder="Type or paste text here..."></textarea>
        <div class="controls">
          <label for="modelSelect" style="margin:0 8px 0 0; font-weight:600 ;color: aliceblue" >Model:</label>
          <select id="modelSelect" style="padding:8px 10px; border-radius:8px; background:rgba(0,0,0,0.1) ;color: aliceblue; border:1px solid rgba(255,255,255,0.15)">
            <option value="vader" style="color: aliceblue;">VADER (default)</option>
            <option value="rule" style="color: aliceblue;">Rule-based (demo)</option>
          </select style="color: aliceblue">
          <button id="analyzeBtn" >Analyze Text</button>
          <input type="file" id="fileInput" accept=".txt" style="color: #ffffff;"/>
          <button id="analyzeFileBtn">Analyze File</button>
          <button id="exportPdfBtn" title="Export a PDF report of the last result">Export PDF</button>
        </div>
      </section>
    </div>
  </div>

  <div class="section theme-amber" aria-expanded="true" data-key="sec-result">
    <button class="section-header" type="button"><span class="icon" aria-hidden></span><h2 style="color: aliceblue;">Result</h2><span class="chevron" aria-hidden>▾</span></button>
    <div class="section-content">
      <section class="result-grid" aria-label="Analysis result layout">
        <div class="panel-summary" style="color: aliceblue;">
          <div id="summary" class="summary" style="color: aliceblue;">No analysis yet</div>
          <div id="scoreBars" class="score-bars" style="display:none; color: aliceblue "></div>
          <div id="keywordChips" class="chips" style="display:none; flex-wrap:wrap; gap:8px; color: aliceblue"></div>
        </div>
        <div class="chartWrap" aria-label="Score chart">
          <canvas id="scoresChart" width="400" height="200"></canvas>
        </div>
        <div class="meta-panel">
          <div id="extras" class="meta-block" aria-live="polite"></div>
          <div id="wordcloudWrap" class="meta-block wordcloud" style="display:none" aria-label="Word Cloud">
            <h3 class="meta-title">Word Cloud</h3>
            <img id="wordcloudImg" alt="Word Cloud" />
          </div>
        </div>
      </section>
    </div>
  </div>
{% endblock %}
{% block scripts %}
  <script src="/static/main.js"></script>
{% endblock %}
