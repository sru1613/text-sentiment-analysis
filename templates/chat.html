{% extends 'base.html' %}
{% block title %}Chat - Sentiment App{% endblock %}
{% block breadcrumbs %}
  💬 Chat
{% endblock %}
{% block content %}
  <h1>Chatbot</h1>
  <div class="section theme-rose" aria-expanded="true" data-key="sec-chat">
    <button class="section-header" type="button"><span class="icon" aria-hidden></span><h2>Chatbot</h2><span class="chevron" aria-hidden>▾</span></button>
    <div class="section-content">
      <section class="chat">
        <div class="chat-top-controls controls" style="flex-wrap:wrap; gap:8px">
          <label for="toneSelect" style="margin:0; font-weight:600;color: rgb(252, 252, 252);">Tone:</label>
          <select id="toneSelect" style="padding:8px 10px; border-radius:8px;color: rgb(253, 248, 248); background:rgba(0,0,0,0.1); border:1px solid rgba(0, 0, 0, 0.15)">
            <option value="listening">Listening (empathetic)</option>
            <option value="coaching">Coaching (action-focused)</option>
          </select>
          <div id="quickReplies" class="chips" style="display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; color: aliceblue;"></div>
        </div>
        <div id="chatMessages" class="summary" style="min-height:140px;color: rgb(255, 255, 255);">Say hello to start chatting…</div>
        <div class="controls">
          <input id="chatInput" type="text" placeholder="Type your message…" style="flex:1;color: rgb(255, 255, 255); padding:10px; border-radius:10px; border:1px solid rgba(0, 0, 0, 0.15); background:rgba(0,0,0,0.1)" />
          <button id="chatSendBtn">Send</button>
        </div>
      </section>
    </div>
  </div>
{% endblock %}
{% block scripts %}
  <script src="/static/main.js"></script>
{% endblock %}
